name: Refresh dependency lockfile

on:
  push:
    branches:
      - feat/ux-public-portal-subscription-history
    paths:
      - package.json
      - apps/admin/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Resolve and validate dependencies
        run: |
          bun install
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build:admin
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile"
          git push
