name: Refresh dependency lockfile

on:
  push:
    branches:
      - feat/ux-public-portal-subscription-history
    paths:
      - package.json
      - apps/admin/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Resolve dependencies and format modified files
        run: |
          bun install
          bun run format
      - name: Commit formatted changes and updated lockfile
        run: |
          if git diff --quiet; then
            echo "No formatting or lockfile updates are needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add bun.lock
          git commit -m "chore: format branch changes and refresh Bun lockfile"
          git push
