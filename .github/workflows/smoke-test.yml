name: Worker smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      deployed: ${{ steps.check.outputs.deployed }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            })
            const deploy = data.jobs.find(job => job.name === 'deploy')
            core.setOutput('deployed', deploy?.conclusion === 'success' ? 'true' : 'false')

  smoke:
    needs: gate
    if: always() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.deployed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify root redirect
        env:
          BASE_URL: https://gkd-subscription-hub.cjy081219.workers.dev
        run: |
          set -euo pipefail
          getent ahosts gkd-subscription-hub.cjy081219.workers.dev
          status=$(curl --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors -sS -o /tmp/root.body -D /tmp/root.headers -w '%{http_code}' "$BASE_URL/" || echo CURL_ERROR)
          echo "ROOT_HTTP_STATUS=$status"
          cat /tmp/root.headers || true
          if [ "$status" != "302" ]; then cat /tmp/root.body || true; exit 1; fi
          grep -Eiq '^location: https://gkd-subscription-hub\.cjy081219\.workers\.dev/admin/' /tmp/root.headers

      - name: Verify admin SPA and protected API
        env:
          BASE_URL: https://gkd-subscription-hub.cjy081219.workers.dev
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/admin/" -o /tmp/admin.html
          grep -q 'id="app"' /tmp/admin.html
          status=$(curl -sS -o /tmp/api.json -w '%{http_code}' "$BASE_URL/admin/api/projects")
          test "$status" = "401"

      - name: Verify registered subscription and version metadata
        env:
          BASE_URL: https://gkd-subscription-hub.cjy081219.workers.dev
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/233/gkd.json5" -o /tmp/gkd.json5
          grep -Fq "id:233" /tmp/gkd.json5
          grep -Fq "author:'⚠警告'" /tmp/gkd.json5
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/233/gkd.version.json5" -o /tmp/gkd.version.json5
          grep -Fq "id:233,version:16" /tmp/gkd.version.json5

      - name: Verify temporary legacy endpoint and explicit 404
        env:
          BASE_URL: https://gkd-subscription-hub.cjy081219.workers.dev
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE_URL/gkd.json5" -o /tmp/legacy.json5
          grep -Fq "id:233" /tmp/legacy.json5
          status=$(curl -sS -o /tmp/not-found.txt -w '%{http_code}' "$BASE_URL/this-path-must-not-exist")
          test "$status" = "404"
