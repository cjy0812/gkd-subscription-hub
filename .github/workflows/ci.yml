name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "手动运行模式"
        type: choice
        options: [verify, preview, delete-preview, release]
        required: true
        default: verify
      preview_name:
        description: "手动预览名称（仅小写字母、数字和连字符）"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Require reproducible install
        run: |
          test -f bun.lock
          bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:admin
      - name: Upload admin build for Preview
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/admin/dist/
          if-no-files-found: error
          retention-days: 1

  preview:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number || inputs.preview_name || github.ref_name }}
      cancel-in-progress: true
    env:
      PREVIEW_WORKER: ${{ github.event_name == 'pull_request' && format('gkd-subscription-hub-pr-{0}', github.event.pull_request.number) || format('gkd-subscription-hub-{0}', inputs.preview_name || 'manual') }}
      CLOUDFLARE_ACCOUNT_ID: "084099361afdf1265c20c09fb3834a6f"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/admin/dist/
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::缺少 production Environment Secret：CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "$ADMIN_PASSWORD" ]] || { echo "::error::缺少 production Environment Secret：ADMIN_PASSWORD"; exit 1; }
          [[ "$PREVIEW_WORKER" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::Preview Worker 名称不符合 Cloudflare 命名规则"; exit 1; }
      - name: Prepare isolated Preview configuration
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('wrangler.preview.jsonc', 'utf8'))
          config.name = process.env.PREVIEW_WORKER
          config.vars.SUBSCRIPTION_DOMAIN = process.env.PREVIEW_WORKER + '.cjy081219.workers.dev'
          fs.writeFileSync('.wrangler.preview.generated.jsonc', JSON.stringify(config, null, 2) + '\n')
          fs.writeFileSync('.preview-secrets.json', JSON.stringify({
            ADMIN_PASSWORD: process.env.ADMIN_PASSWORD,
          }))
          NODE
      - name: Deploy isolated Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --config .wrangler.preview.generated.jsonc --name "$PREVIEW_WORKER" --secrets-file .preview-secrets.json
      - name: Smoke test Preview
        env:
          PREVIEW_URL: ${{ format('https://{0}.cjy081219.workers.dev', env.PREVIEW_WORKER) }}
        run: |
          set -euo pipefail
          status=""
          for attempt in {1..10}; do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/admin.html -w '%{http_code}' "$PREVIEW_URL/admin/" || true)"
            [[ "$status" == "200" ]] && break
            sleep 3
          done
          test "$status" = "200"
          grep -q 'id="app"' /tmp/admin.html
          api_status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/api.json -w '%{http_code}' "$PREVIEW_URL/admin/api/projects")"
          test "$api_status" = "401"
          root_status="$(curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")"
          test "$root_status" = "302"
      - name: Publish Preview URL to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ format('https://{0}.cjy081219.workers.dev', env.PREVIEW_WORKER) }}
          PREVIEW_WORKER: ${{ env.PREVIEW_WORKER }}
        with:
          script: |
            const marker = '<!-- gkd-subscription-hub-preview -->'
            const body = [
              marker,
              '## Cloudflare Preview',
              '',
              '预览地址：' + process.env.PREVIEW_URL,
              '',
              'Worker：' + process.env.PREVIEW_WORKER,
              '',
              '该 PR 使用独立 Worker 和独立于生产环境的 Preview KV。不同 PR 之间共享 Preview KV。',
              'Preview URL 默认公开，管理密码与生产环境相同。请勿在预览环境写入敏感数据。',
              '',
              '关闭 PR 后会自动删除对应 Preview Worker，Preview KV Namespace 保留。',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number })
            const previous = comments.data.find(comment => comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - name: Remove temporary secrets
        if: always()
        run: rm -f .preview-secrets.json .wrangler.preview.generated.jsonc

  cleanup_preview:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'delete-preview')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Delete Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "084099361afdf1265c20c09fb3834a6f"
        run: |
          set -euo pipefail
          worker="${{ github.event_name == 'pull_request' && format('gkd-subscription-hub-pr-{0}', github.event.pull_request.number) || format('gkd-subscription-hub-{0}', inputs.preview_name || 'manual') }}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker"
          status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/worker.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          if [[ "$status" == "404" ]]; then
            echo "Preview Worker 不存在，跳过清理"
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            cat /tmp/worker.json
            echo "::error::无法读取 Preview Worker，HTTP $status"
            exit 1
          fi
          status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          if [[ "$status" != "200" ]]; then
            cat /tmp/delete.json
            echo "::error::删除 Preview Worker 失败，HTTP $status"
            exit 1
          fi
          cat /tmp/delete.json | jq -e '.success == true' >/dev/null

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require production deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::缺少 CLOUDFLARE_API_TOKEN，生产部署已中止"; exit 1; }
          [[ -n "$ADMIN_PASSWORD" ]] || { echo "::error::缺少 ADMIN_PASSWORD，生产部署已中止"; exit 1; }
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare deployment secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          bun -e 'const secrets = { ADMIN_PASSWORD: process.env.ADMIN_PASSWORD }; if (process.env.NOTIFY_TOKEN) secrets.NOTIFY_TOKEN = process.env.NOTIFY_TOKEN; await Bun.write(".secrets.json", JSON.stringify(secrets))'
      - name: Build and deploy production Worker
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "084099361afdf1265c20c09fb3834a6f"
      - name: Remove temporary secrets file
        if: always()
        run: rm -f .secrets.json
