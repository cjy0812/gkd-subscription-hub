name: CI - Quality Checks
run-name: CI - Quality Checks / ${{ github.ref_name }}

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies with frozen lockfile
        run: |
          test -f bun.lock
          bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Run linter
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Build admin app
        run: bun run build:admin
      - name: Install Chromium for browser acceptance
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Start admin browser test server
        run: |
          bun run --filter @gkd-hub/admin dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gkd-admin-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/admin/monitoring > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gkd-admin-vite.log
          exit 1
      - name: Run browser acceptance at required viewports
        run: |
          npx --yes --package=playwright@1.56.1 -c 'PLAYWRIGHT_PACKAGE_DIR="$(dirname "$(readlink -f "$(command -v playwright)")")" node scripts/browser-acceptance.mjs'
      - name: Upload browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-acceptance
          path: artifacts/browser-acceptance/
          if-no-files-found: ignore
